<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>互動控制台 | 終極課堂互動系統</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script src="/socket.io/socket.io.js"></script>
</head>
<body>
    <div class="host-container">
        <!-- 左側面板：PIN碼與玩家 -->
        <div class="panel">
            <div style="background: rgba(0,240,255,0.1); border: 2px solid var(--accent-color); padding: 1.5rem; border-radius: 12px; margin-bottom: 2rem; text-align: center; box-shadow: 0 0 20px rgba(0,240,255,0.2);">
                <div style="color: var(--text-muted); font-size: 1.1rem; margin-bottom: 0.5rem; text-transform: uppercase; font-weight: 600;">課堂大廳 PIN 碼</div>
                <div id="roomPin" style="font-size: 4rem; font-weight: 900; color: white; letter-spacing: 5px;">----</div>
                <div style="font-size: 0.9rem; color: var(--accent-color); margin-top: 10px;">請所有學員在首頁輸入此代碼加入</div>
                <!-- QR Code Block -->
                <div style="margin-top: 1.5rem; display: flex; flex-direction: column; align-items: center;">
                    <img id="qrCode" style="display: none; width: 140px; height: 140px; border-radius: 8px; border: 4px solid white; box-shadow: 0 5px 15px rgba(0,0,0,0.5);" />
                    <div style="font-size: 0.8rem; color: var(--text-muted); margin-top: 8px;">或請學生直接掃描上方條碼進入</div>
                </div>
            </div>

            <h2>👥 已進入人數 (<span id="playerCount">0</span>)</h2>
            <ul id="playerList" class="player-list" style="margin-top: 1rem;">
                <!-- 玩家名單自動插入 -->
            </ul>
        </div>
        
        <!-- 右側面板：操作區與結果區 -->
        <div class="panel">
            <h2>📝 題目類型</h2>
            <div class="mode-selector">
                <button class="mode-btn active" data-mode="BUZZER">⚡ 搶答</button>
                <button class="mode-btn" data-mode="MCQ">🔠 選擇題</button>
                <button class="mode-btn" data-mode="TEXT">✍️ 簡答文字</button>
                <button class="mode-btn" data-mode="DRAW">🎨 手繪畫圖</button>
            </div>

            <div class="control-area">
                <button id="btnStart" class="primary-btn btn-start">✨ 向全體派發題目</button>
                <button id="btnStop" class="primary-btn btn-stop" style="display:none; background: #ff9900;">⏹ 停止作答並顯示結果</button>
                <button id="btnReset" class="primary-btn btn-reset">🔄 回復待命</button>
            </div>
            
            <div class="result-screen" id="resultScreen">
                <div id="winnerAnnounce" class="winner-announce" style="width:100%;">
                    <!-- 勝利者與作答動態 -->
                </div>
                <!-- 供搶答使用的列表 -->
                <div id="sequenceList" class="sequence-list"></div>
            </div>
        </div>
    </div>
    <script src="host.js"></script>
</body>
</html>
